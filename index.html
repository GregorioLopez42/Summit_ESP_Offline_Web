<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Summit ESP Offline Web</title><link rel="stylesheet" href="styles.css"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#162c3d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Summit ESP"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"></head><body><header><img src="Summit_Logo_RGB.png"><div><select id="language"><option value="es">Español</option><option value="en">English</option></select></div></header><nav><button data-tab="job" data-i18n="job">Trabajo</button><button data-tab="vsd" class="active">VSD CALCS</button></nav><main><section id="job" class="tab"><h2 data-i18n="jobInfo">Información del trabajo</h2><div class="grid"><label><span data-i18n="tech">Técnico</span><input data-k="tech"></label><label><span data-i18n="date">Fecha</span><input type="date" data-k="date"></label><label>SK Job #<input data-k="sk"></label><label><span data-i18n="customer">Cliente</span><input data-k="customer"></label><label><span data-i18n="field">Campo</span><input data-k="field"></label><label><span data-i18n="well">Pozo</span><input data-k="well"></label></div></section><section id="vsd" class="tab active sheet"><div class="brand"><img src="Summit_Logo_RGB.png"></div><h2>VARIABLE SPEED (VOLT/HZ) CALCULATIONS</h2><div class="meta"><label><span data-i18n="customer">Cliente</span><input data-sync="customer" readonly></label><label>SK JOB<input data-sync="sk" readonly></label><label><span data-i18n="field">Campo</span><input data-sync="field" readonly></label><label><span data-i18n="tech">Técnico</span><input data-sync="tech" readonly></label><label><span data-i18n="well">Pozo</span><input data-sync="well" readonly></label><label><span data-i18n="date">Fecha</span><input data-sync="date" readonly></label></div><div class="toolbar"><select id="mode"><option value="field" data-i18n="fieldMode">Campo</option><option value="engineering" data-i18n="engineeringMode">Ingeniería</option></select><button id="clear" data-i18n="clear">Limpiar</button></div><div id="status" class="status ok">CONFIGURATION VALID</div><div id="warnings" hidden></div><div id="driveMode" hidden></div><h3>INPUT DATA</h3><div class="groups"><fieldset><legend data-i18n="motorData">DATOS DEL MOTOR</legend><div class="inputs motor"><label>HP<input type="number" data-k="hp" value="140"></label><label>VOLTS<input type="number" data-k="mv" value="1635"></label><label>AMPS<input type="number" data-k="ma" value="44"></label><label>HZ<input type="number" data-k="ratedHz" value="130"></label><label>MTR RATED RPM<input type="number" data-k="rpm" value="3600"></label></div></fieldset><fieldset><legend data-i18n="surfaceData">DATOS DE SUPERFICIE</legend><div class="inputs surface"><label>MAX HZ<input type="number" data-k="maxHz" value="130"></label><label>MIN HZ<input type="number" data-k="minHz" value="70"></label><label>UNDERLOAD %<input type="number" data-k="under" value="60"><small>below nameplate</small></label><label>OVERLOAD %<input type="number" data-k="over" value="10"><small>over nameplate</small></label><label class="available">AVAILABLE VOLTS<input type="number" data-k="available" value="2098"><small id="availableSuggestion"></small></label><label>DRIVE OUTPUT VOLTS<input type="number" data-k="drive" value="480"></label><label>INPUT VOLTAGE<input type="number" data-k="inputVoltage" value="480"></label><label>DRIVE CAPACITY (kVA)<input type="number" data-k="driveKVA" value="160"></label><label><span data-i18n="source">DRIVE CURRENT SOURCE</span><select data-k="driveCurrentMode"><option value="calculated" data-i18n="calculated">Calculada</option><option value="manual" data-i18n="manual">Ingresada</option></select></label><label id="manualLabel"><span>DRIVE CURRENT INPUT (A)</span><input type="number" data-k="manualDriveCurrent" value="0"><small id="currentRef"></small></label></div></fieldset><fieldset><legend data-i18n="downholeData">DATOS DE FONDO</legend><div class="inputs downhole"><label>Length (ft)<input type="number" data-k="length" value="7217"></label><label>DOWNHOLE TEMP (°F)<input type="number" data-k="temp" value="221"></label><label>AWG<select data-k="awg"><option>6</option><option>16mm</option><option selected>4</option><option>2</option><option>1</option><option>1/O</option><option>2/O</option></select></label></div></fieldset></div><h3>SET UP FOR VSC</h3><div id="results"></div></section><section id="report" class="sheet" hidden><div class="brand"><img src="Summit_Logo_RGB.png"></div><h2>VARIABLE SPEED (VOLT/HZ) CALCULATIONS</h2><div id="reportBody"></div></section></main><footer><button id="save" data-i18n="save">Guardar</button><button id="export">Export JSON</button><label>Import JSON<input id="import" type="file" hidden></label><button id="print" data-i18n="pdf">Generar Reporte PDF</button></footer><script src="app.js"></script></body></html>
